# ===========================================================================
# .gitleaks.toml
# Secret scanning configuration for this repository.
#
# Run locally:   gitleaks detect --config .gitleaks.toml --redact
# Pre-commit:    installed by .pre-commit-config.yaml
# CI:            same command; a non-zero exit fails the pipeline.
#
# The build carries a second, narrower control: build/SecretHygiene.targets
# fails the build when appsettings.json gains a secret shaped key with a value.
# ===========================================================================

title = "SqlTicketsConnector"

# Start from the maintained default rule set, then add the rules that matter for
# this codebase rather than replacing everything with hand-written regexes.
[extend]
useDefault = true

# --- Repository specific rules ---------------------------------------------

[[rules]]
id = "sql-connection-string-with-password"
description = "SQL connection string carrying a password"
regex = '''(?i)(server|data\s*source)\s*=[^;'"]{1,120};[^'"]{0,240}?(password|pwd)\s*=\s*[^;'"\s]{1,120}'''
tags = ["sql", "connection-string", "password"]

[[rules]]
id = "trust-server-certificate"
description = "TrustServerCertificate=true disables SQL transport validation"
regex = '''(?i)trust\s*server\s*certificate\s*=\s*(true|yes)'''
tags = ["sql", "tls", "policy"]

[[rules]]
id = "pfx-or-key-material"
description = "Certificate or key material committed to the repository"
# CONTENT ONLY, no file extensions. This used to also match `\.pfx\b|\.p12\b`,
# which finds the STRING ".pfx" wherever it appears - and the places it appears
# in this repository are .gitignore's own `*.pfx` rule, Build.ps1's
# forbidden-extension check, and the documentation explaining why certificates
# are never committed. The rule was alarming on the three controls that exist to
# prevent the thing it is looking for.
#
# Filenames are somebody else's job and already covered: .gitignore blocks the
# extensions, the no-certificate-files pre-commit hook rejects them by name, and
# Build.ps1 fails a package containing one. gitleaks reads content, so it looks
# for the one thing that is unambiguously key material wherever it appears.
regex = '''(?i)-----BEGIN (RSA |EC |ENCRYPTED )?PRIVATE KEY-----'''
tags = ["certificate", "private-key"]

[[rules]]
id = "appsettings-inline-secret"
description = "Secret shaped configuration key with a value"
# NO LOOKAHEAD. This read `"(?!\s*")[^"]{1,200}"` to mean "the value is not
# empty", which is correct PCRE and impossible in RE2 - the engine gitleaks
# uses. gitleaks does not skip a rule it cannot compile; it panics on the
# config, so this one expression stopped EVERY rule in this file from ever
# running. The secret scan has been a control on paper since it was written,
# passing because it never executed.
#
# The RE2 spelling of the same intent: allow leading whitespace, then require
# at least one character that is neither a quote nor whitespace, which is what
# makes "" and "   " not match while a real value does.
regex = '''(?i)"[^"]*(password|secret|pwd|apikey|api_key|connectionstring)[^"]*"\s*:\s*"\s*[^"\s][^"]{0,199}"'''
path = '''(?i)appsettings.*\.json$'''
tags = ["configuration"]

[[rules]]
id = "entra-client-secret"
description = "Entra client secret value"
regex = '''(?i)(client_secret|clientsecret|app_secret)\s*[:=]\s*["']?[A-Za-z0-9~._\-]{20,}'''
tags = ["entra", "oauth"]

# --- Allowlist --------------------------------------------------------------
#
# Every entry here is a deliberate decision, not a convenience. Keep the list
# short and explain each one, because a reviewer reads this file to work out
# what the scan is not looking at.

[allowlist]
description = "Documented references that are not secrets"

# The regexes below are written against the whole LINE - they name a key and the
# shape of its value - and gitleaks matches an allowlist against the captured
# secret unless told otherwise. Without this they never match anything, and
# every documented reference below reports as a leak. Nobody found that out
# because the config did not compile at all until the lookahead above was
# removed, so no allowlist in this file has ever been exercised either.
regexTarget = "line"

paths = [
  # Compiled output and restored packages.
  '''(^|/)(bin|obj|artifacts)/''',

  # Three test files that hold credential-shaped strings ON PURPOSE. The
  # redaction canaries exist to be logged and then proven absent from the sink,
  # and a fake client secret and a fake connection string are what those tests
  # are about. A scanner flagging them has not understood the test.
  #
  # STATED PLAINLY BECAUSE IT IS A REAL HOLE: a genuine secret pasted into one
  # of these three files would not be reported. They are named individually
  # rather than allowlisting tests/ for exactly that reason, and configuration
  # - the place credentials actually arrive - is covered by the appsettings
  # scan in SecretHygiene.targets, which reads JSON paths rather than lines.
  '''^tests/SqlTicketsConnector\.Tests/RedactionCanaryTests\.cs$''',
  '''^tests/SqlTicketsConnector\.Tests/PushLoggingRedactionTests\.cs$''',
  '''^tests/SqlTicketsConnector\.Tests/ClientSecretAuthTests\.cs$''',
]

regexes = [
  # KeyVault:Secrets maps a logical name to the NAME of a vault secret. The value
  # is a lookup key, not a credential.
  '''"SqlPassword"\s*:\s*"[a-z0-9\-]+"''',

  # Placeholder tokens shipped in appsettings.json. Deployment replaces them and
  # startup validation rejects them if it does not.
  '''REPLACE-WITH-[A-Z\-]+''',

  # Documentation and tests describe the shape of a bad connection string on
  # purpose; the canary value below is not a real credential.
  '''CANARY-9d41b2f7-customer-record''',
  '''<paste from Key Vault, do not commit>''',

  # The three places that NAME TrustServerCertificate in order to warn about it
  # or to record that it is refused. The rule above is a policy rule, not a
  # credential rule, and it cannot tell a connection string that disables TLS
  # validation from a sentence saying such a string is rejected.
  #
  # Deliberately matched by the surrounding words rather than by file path. A
  # path allowlist would exempt those files entirely, including a real
  # connection string added to one of them later; these three shapes only
  # exempt the sentence, so `TrustServerCertificate=true` written as
  # configuration is still reported anywhere it appears - including in the same
  # files, on any other line.
  #
  # Found by the release/net9 merge. On main these lines are old, and the
  # pre-commit hook only scans what a commit adds, so nothing had ever
  # presented them to the scanner. The branch that was 33 commits behind added
  # all three at once and they were reported immediately - which is a fair
  # description of how much of this allowlist has actually been exercised.
  '''rejects `?TrustServerCertificate=true`?''',
  '''sets TrustServerCertificate=true, which is rejected''',
  '''TrustServerCertificate=true is in effect''',
]
