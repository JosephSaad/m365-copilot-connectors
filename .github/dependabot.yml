# ===========================================================================
# Dependabot configuration. SECURITY UPDATES ONLY.
#
# Alerts and security updates are enabled on the repository itself. This file
# used to add scheduled version updates as well; it no longer does, and
# open-pull-requests-limit: 0 is how that is switched off. Everything else here
# is kept deliberately - see "why the file survives" below.
#
# WHY VERSION UPDATES WERE TURNED OFF, since the reason is structural rather
# than a preference. Every version-update pull request from here failed
# build/Test-OfflinePackageList.ps1, and always would have. That check compares
# the pinned offline package list against the resolved restore graph, so an
# air-gapped rebuild restores from a known set; a version bump changes the graph
# by definition, and regenerating the list is a hand-run step Dependabot has no
# way to perform. The result was a weekly pull request that built green, tested
# green, and could never go in as raised. Evidence: #15 on 2026-08-31, bumping
# System.Data.Odbc 9.0.0 to 10.0.11 - 0 errors and 0 warnings on both target
# frameworks, then "no longer matches the net10.0 restore graph (62 packages
# resolved, 62 listed for this target)". Same count, different contents, which
# is the check being content-sensitive on purpose.
#
# SECURITY UPDATES STILL ARRIVE, and that is the whole point of using the limit
# rather than deleting the block. GitHub's documentation is explicit: "Security
# update pull requests are not subject to this limit and do not count toward
# it." Alerts are a third mechanism again and fire regardless of anything here.
#
# TAKING A BUMP BY HAND is now the route for a non-security update, and it is
# one change rather than two:
#
#     dotnet restore SqlTicketsConnector.sln
#     pwsh build/Test-OfflinePackageList.ps1 -Configuration Base -Update
#
# Commit the edited Directory.Packages.props and the regenerated list together.
# A security pull request needs the same treatment before it can merge, so
# expect a red check on one and finish it by hand rather than reading the red as
# a reason to leave an advisory open.
#
# WHY THE FILE SURVIVES rather than being deleted. The ignore rules below have
# to stay: they carry evidence that took two failed pull requests to establish,
# and they take effect again the moment somebody restores the limit. They are
# also, per the same documentation, "only affect[ing] version updates, not
# security updates" - so they were never suppressing an advisory, and they are
# not suppressing one now. The consequence worth knowing: an advisory against
# the three pinned gRPC and protobuf packages WILL raise a pull request that
# cannot be merged as a bump, because it needs the migration project described
# in docs/SECURITY.md section 3.
# ===========================================================================

version: 2

updates:
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "07:00"
      timezone: "Europe/London"
    # Zero disables VERSION updates for this ecosystem. Security update pull
    # requests are not subject to this limit and do not count toward it, so they
    # continue to arrive. Restoring scheduled version updates is this one number
    # - but read the offline package list note in the header first, because the
    # pull requests it produces still cannot merge without a hand-run step.
    open-pull-requests-limit: 0

    labels:
      - "dependencies"
      - "security"
    commit-message:
      prefix: "deps"
      include: "scope"

    ignore:
      # The three below move as a set or not at all, so they are ignored
      # outright rather than by version range. Evidence: the Grpc.Tools 2.83.0
      # pull request Dependabot opened on 2026-08-14 failed CI with
      # "MapField<string, GenericType> does not contain a definition for
      # MergeFrom" — newer generated code requires a newer Google.Protobuf
      # runtime than the pinned 3.18.0. An automated single-package bump cannot
      # succeed here; it only produces red pull requests nobody can merge.
      #
      # Pinned to the legacy native gRPC stack the Microsoft connector contracts
      # were generated against. Moving to Grpc.AspNetCore means regenerating the
      # server stubs and rewriting the host: a project, not a dependency bump.
      # Recorded as an accepted risk in docs/SECURITY.md section 3.
      - dependency-name: "Grpc.Core"
      - dependency-name: "Grpc.Tools"

      # Pinned to match the version of the protobuf code generator above.
      # A mismatch changes what the generated contract types compile against.
      - dependency-name: "Google.Protobuf"

      # Kiota 2.x is a major rewrite; the Graph SDK on the 5.x line expects 1.x.
      # This package is referenced only to hold a security floor, so let minor
      # and patch updates through and leave the major bump to a Graph SDK move.
      - dependency-name: "Microsoft.Kiota.Abstractions"
        update-types: ["version-update:semver-major"]

      # The other half of that pair. Graph 6.x requires Kiota 2.0.0, which the
      # pin above rules out, so the major bump cannot be merged as a bump:
      # Dependabot opened it as #6 on 2026-08-14 and it was closed unmerged for
      # exactly that reason. Taking Graph 6.x means moving to Kiota 2.x and
      # confirming GHSA-7j59-v9qr-6fq9 is still fixed there, which is a change
      # with its own testing. Minor and patch updates on the 5.x line still come
      # through, and an advisory against Microsoft.Graph still raises an alert.
      - dependency-name: "Microsoft.Graph"
        update-types: ["version-update:semver-major"]
