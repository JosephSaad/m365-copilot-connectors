# The public Pages site serves four documents: the Copilot Router, the genesis
# prompt that rebuilds it, the release diff for the range the connector is
# currently on, and the connector onboarding questionnaire. Everything else in
# docs/ is repository documentation, readable as source on GitHub but
# deliberately not published as a website.
#
# THE ONBOARDING FORM IS PUBLIC, so it must stay free of customer identifiers.
# It asks about a source's security posture, and the answers people type into it
# stay in their own browser - but the QUESTIONS ship to anyone with the URL. A
# domain name, a cluster name or a hostname in a hint or a tooltip is a leak the
# moment it is committed. One went in and was caught before this file changed;
# check for another before adding to it.
name: pages
on:
  push:
    branches: [main]
    paths:
      - docs/copilot-router.html
      - docs/GENESIS-PROMPT-COPILOT-ROUTER.md
      - docs/release-diff.html
      - docs/connector-onboarding-form.html
      - .github/scripts/render-genesis.py
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Stage the published documents
        run: |
          pip install --quiet markdown
          mkdir _site
          cp docs/copilot-router.html _site/copilot-router.html
          # The site root is the router, so the bare URL works too.
          cp docs/copilot-router.html _site/index.html
          # Self-contained already - a full document, not a fragment.
          cp docs/release-diff.html _site/release-diff.html
          # Same: one file, no assets, answers kept in the reader's own browser.
          cp docs/connector-onboarding-form.html _site/connector-onboarding.html
          python .github/scripts/render-genesis.py \
            docs/GENESIS-PROMPT-COPILOT-ROUTER.md _site/genesis-prompt.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
