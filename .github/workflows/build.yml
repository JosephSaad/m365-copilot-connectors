# ===========================================================================
# Build, test, and package.
#
# Runs on windows-latest, not ubuntu, for two reasons:
#   1. It is the deployment target. The event log sink, the certificate store
#      resolver and the win-x64 publish path only mean anything on Windows.
#   2. Grpc.Tools 2.40.0 ships a per-RID protoc. The Windows runner exercises the
#      same code generation an engineer gets locally, so a contract change that
#      breaks the generated stubs fails here rather than at install time.
#
# The build job's four gates are the same four Build.ps1 enforces before it will
# produce a deployment package: secret hygiene, a warning-free build, the tests,
# and the dependency audit. That parity is the point, and it is load-bearing now
# that the package job runs Build.ps1 to produce a release artefact: if you add a
# gate to one, add it to the other.
#
# Third-party actions are pinned to commit SHAs rather than tags. A tag can be
# moved; a SHA cannot. The version each SHA corresponds to is in the comment
# beside it, so a reviewer can check the claim.
# ===========================================================================

name: build

on:
  push:
    # release/net9 is the .NET 9 line for Visual Studio 2022, identical to main
    # apart from the target framework and the pinned SDK. It builds here for the
    # same reason main does: nobody looks at it until a release is wanted.
    branches: [main, release/net9]
    tags: ["v*"]
  pull_request:
    branches: [main]
  # Publishing a release against a tag that already exists fires no push event.
  # Without this trigger such a release would never receive its package.
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  # Cancel superseded branch builds, never a tag or release build: those produce
  # an artefact somebody is waiting on, and a half-cancelled publish is worse
  # than a slow one.
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    name: Build and test (windows-latest)
    runs-on: windows-latest

    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up .NET 9
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "9.0.x"

      - name: Restore
        run: dotnet restore SqlTicketsConnector.sln

      # Fails the build when an appsettings.json gains a key matching
      # password|secret|pwd|apikey|connectionstring with a non-empty value.
      # Same task the projects run during a normal build; this runs it across the
      # whole repository without compiling anything.
      - name: Secret hygiene scan
        run: dotnet build build/SecretHygiene.proj -t:ScanAppSettingsForSecrets -nologo -v:m

      # The solution promises to build clean apart from NETSDK1206 and CS8981,
      # both suppressed in the project files with a comment saying why. Treating
      # everything else as an error is what keeps that promise true. It has
      # already earned its place: it caught an obsolete Azure.Identity
      # constructor, and NuGet downgrade conflicts across the three projects.
      - name: Build (warnings are errors)
        run: dotnet build SqlTicketsConnector.sln -c Release --no-restore -warnaserror

      - name: Test
        run: >
          dotnet test SqlTicketsConnector.sln
          -c Release --no-build --nologo
          --logger "trx;LogFileName=test-results.trx"
          --results-directory artifacts/test-results

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results
          path: artifacts/test-results
          retention-days: 30

      # build/Get-OfflinePackages.ps1 lists every package an air-gapped build
      # machine has to be given. Nothing in this repository consumes that list,
      # so a dependency bump would leave it stale in silence and the first
      # person to notice would be standing at a machine with no NuGet access.
      #
      # It runs after the build and the tests, not before: every bump is drift
      # by definition, so a bump pull request fails here every time, and a check
      # that fails first would hide whether the bump itself compiles and passes.
      # Read the failure as "and also regenerate the list", never as the verdict
      # on the change. The command to do that is in the failure message.
      #
      # This is a repository hygiene check rather than a fifth package gate:
      # Build.ps1 does not run it, because the OTLP and self-contained
      # configurations need their own restores to check against.
      - name: Verify the offline package list (base)
        shell: pwsh
        run: ./build/Test-OfflinePackageList.ps1 -Configuration Base

      # dotnet list exits 0 whether or not it finds anything, so the output has
      # to be inspected. This is the check that would have caught the Kiota
      # header-leak advisory before it reached a release.
      - name: Dependency audit
        shell: pwsh
        run: |
          $vulnerable = dotnet list SqlTicketsConnector.sln package --vulnerable --include-transitive 2>&1 | Out-String
          Write-Host $vulnerable
          if ($vulnerable -match 'has the following vulnerable packages') {
              Write-Error 'Vulnerable packages found. Raise the version, or pin the transitive dependency with a comment naming the advisory.'
              exit 1
          }
          Write-Host 'No vulnerable packages.' -ForegroundColor Green

      # The OTLP exporter is optional and off by default, which is exactly how a
      # configuration rots: it shipped documented and unbuildable, because
      # Serilog.Sinks.OpenTelemetry needs Google.Protobuf 3.26.1 or later while
      # the contract codegen pins 3.18.0. Enabling it now raises the protobuf
      # runtime, and this step is what keeps that true. Last, because it
      # re-restores the solution with a different graph.
      - name: Build with the optional OTLP exporter
        run: |
          dotnet restore SqlTicketsConnector.sln -p:EnableOtlpExporter=true
          dotnet build SqlTicketsConnector.sln -c Release --no-restore -warnaserror -p:EnableOtlpExporter=true

      # Has to follow that restore: the exporter's packages are only in the
      # graph once it has run. This is also the configuration where the list is
      # easiest to get wrong, because enabling the exporter raises
      # Google.Protobuf and Grpc.Core.Api rather than simply adding packages.
      - name: Verify the offline package list (OTLP)
        shell: pwsh
        run: ./build/Test-OfflinePackageList.ps1 -Configuration Otlp

  # =========================================================================
  # The .NET 9 line. Visual Studio 2022 has no .NET 10 support, so a shop on
  # VS 2022 cannot open the default configuration at all; release/net9 exists
  # for them, and its packages are built from the same commits as this branch.
  #
  # Only the .NET 9 SDK is installed here, deliberately. Building net9.0 with
  # the .NET 10 SDK would prove something weaker than the claim: the claim is
  # that the toolchain a VS 2022 machine actually has can build this, and that
  # is the .NET 9 SDK. This job is what stops main from drifting away from a
  # branch nobody looks at until a release is wanted.
  # =========================================================================
  net9:
    name: Build and test for .NET 9 (windows-latest)
    runs-on: windows-latest

    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up .NET 9
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "9.0.x"

      - name: Restore
        run: dotnet restore SqlTicketsConnector.sln -p:ConnectorTargetFramework=net9.0

      - name: Build (warnings are errors)
        run: dotnet build SqlTicketsConnector.sln -c Release --no-restore -warnaserror -p:ConnectorTargetFramework=net9.0

      # The tests are the control evidence for redaction, watermarks and secret
      # rotation. They have to pass on the framework a package is shipped for,
      # not only on the default one.
      - name: Test
        run: dotnet test SqlTicketsConnector.sln -c Release --no-build --nologo -p:ConnectorTargetFramework=net9.0

  # =========================================================================
  # Produces the deployment package by running Build.ps1 exactly as an engineer
  # would, rather than reimplementing it here. The script re-runs the secret
  # scan, the warning-free build, the tests and the dependency audit before it
  # will publish, so the zip cannot come from a tree that would not pass review.
  #
  # A separate job, not extra steps on the build job: Build.ps1 clears the
  # artifacts directory, which is where the build job leaves its test results.
  # =========================================================================
  package:
    name: Deployment package (windows-latest)
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up .NET 9
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "9.0.x"

      # Self-contained: the .NET runtime is bundled, so the target server needs
      # nothing but Windows. Whoever downloads this zip should never have to go
      # and fetch something else to make it run.
      - name: Build the deployment package
        shell: pwsh
        run: ./Build.ps1 -Configuration Release -SelfContained

      # The runtime packs a self-contained publish downloads are the largest
      # part of an offline package set and the easiest to miss: NuGet records
      # them as download dependencies, so they appear in neither the libraries
      # section of the assets file nor 'dotnet list package'. Checking here,
      # after Build.ps1 has published self-contained, is the only place the
      # graph contains them. It also proves the list still gets the right
      # version out of the SDK, rather than a pinned one that has gone stale.
      - name: Verify the offline package list (runtime packs)
        shell: pwsh
        run: ./build/Test-OfflinePackageList.ps1 -Configuration RuntimePacks

      # "Everything is in the zip" is a claim, so it gets checked rather than
      # assumed. The runtime files are what prove self-contained actually took.
      - name: Verify the package is complete and self-contained
        shell: pwsh
        run: |
          $zip = Get-ChildItem -Path . -Filter 'SqlTicketsConnector-*.zip' | Sort-Object LastWriteTime | Select-Object -Last 1
          $extract = Join-Path $env:RUNNER_TEMP 'package-check'
          Expand-Archive -Path $zip.FullName -DestinationPath $extract -Force

          $required = @(
              'publish/SqlTicketsConnector.exe',          # the service
              'publish/appsettings.json',                 # configuration template
              'publish/System.Private.CoreLib.dll',       # bundled runtime
              'publish/hostpolicy.dll',                   # bundled host
              'publish/grpc_csharp_ext.x64.dll',          # Grpc.Core native asset
              'SqlGraphPush/SqlGraphPush.exe',            # direct push tool
              'Install-Connector.ps1',
              'Manifest.json',
              'ConnectionInfo.json',
              'CustomConnectorPortMap.json',
              'README.md',
              'sql/01-least-privilege.sql',
              'sql/02-soft-delete.sql',
              'docs/SECURITY.md',
              'docs/RUNBOOK.md',
              'docs/ASSUMPTIONS.md',

              # A buildable source tree, so one download serves deployment and
              # rebuild. SecretHygiene.targets is imported by every project file:
              # without it the tree does not even restore.
              'source/SqlTicketsConnector.sln',
              'source/Directory.Build.props',              # holds the target framework
              'source/build/SecretHygiene.targets',
              'source/src/SqlTicketsConnector/SqlTicketsConnector.csproj',
              'source/src/SqlTicketsConnector/Contracts/CommonModels.proto',
              'source/tests/SqlTicketsConnector.Tests/SqlTicketsConnector.Tests.csproj'
          )

          $missing = @()
          foreach ($item in $required) {
              if (-not (Test-Path (Join-Path $extract $item))) { $missing += $item }
          }

          if ($missing) {
              $missing | ForEach-Object { Write-Error "Missing from the package: $_" }
              throw 'The deployment package is incomplete.'
          }

          # Build output must never travel inside the source copy: it bloats the
          # package and carries artefacts from whichever machine built it.
          $leaked = Get-ChildItem (Join-Path $extract 'source') -Recurse -Directory -ErrorAction SilentlyContinue |
              Where-Object { $_.Name -in @('bin', 'obj', '.git', '.vs') }

          if ($leaked) {
              $leaked | ForEach-Object { Write-Error "Build output or repository state leaked into source/: $($_.FullName)" }
              throw 'The staged source tree is not clean.'
          }

          # A framework-dependent build is roughly 20 MB; a self-contained one is
          # far larger. A size floor catches a silently reverted -SelfContained.
          $sizeMb = [math]::Round($zip.Length / 1MB, 1)
          if ($sizeMb -lt 60) {
              throw "Package is only $sizeMb MB. That is too small to contain the .NET runtime; was -SelfContained dropped?"
          }

          $count = (Get-ChildItem $extract -Recurse -File).Count
          Write-Host "Package OK: $($zip.Name), $sizeMb MB, $count files, runtime bundled." -ForegroundColor Green

      # README's "Transfer via SharePoint" section moves this zip through a
      # document library by hand. A checksum is what lets the operator on the
      # far end prove the file survived that round trip.
      #
      # The digest is written with LF and two spaces: GNU sha256sum -c treats a
      # trailing CR as part of the filename and reports "no properly formatted
      # checksum lines found", so Set-Content's CRLF would make the file useless
      # on exactly the machines most likely to check it.
      - name: Checksum
        shell: pwsh
        run: |
          $zip = Get-ChildItem -Path . -Filter 'SqlTicketsConnector-*.zip' | Sort-Object LastWriteTime | Select-Object -Last 1
          if (-not $zip) { Write-Error 'Build.ps1 produced no deployment zip.'; exit 1 }
          $hash = (Get-FileHash -Path $zip.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          [System.IO.File]::WriteAllText("$($zip.FullName).sha256", "$hash  $($zip.Name)`n")
          Write-Host "SHA256 $hash  $($zip.Name)"

      - name: Upload deployment package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: deployment-package
          path: |
            SqlTicketsConnector-*.zip
            SqlTicketsConnector-*.zip.sha256
          if-no-files-found: error
          retention-days: 90

  # =========================================================================
  # Attaches the package to the release for a v* tag. Split into its own job so
  # that contents: write, the only privilege in this workflow that can change
  # the repository, exists on a job that runs for tags and releases and nowhere
  # else.
  #
  # Both orderings work: pushing a v* tag creates a DRAFT release and populates
  # it, leaving a human to press publish; publishing a release that already
  # exists uploads into it. CI never publishes a release on its own, because the
  # zip is the artefact a change advisory board approves.
  # =========================================================================
  # =========================================================================
  # The offline package set: every NuGet package a build machine with no route
  # to api.nuget.org has to be given, zipped and attached to the release beside
  # the deployment package.
  #
  # A separate asset rather than more weight in the deployment zip. That zip goes
  # to a server which only runs the connector and never rebuilds it; this one is
  # for the machine that does, and most people need exactly one of the two.
  #
  # Both SDKs are installed on purpose, and neither is selected here. The script
  # asks MSBuild which runtime packs the build wants, and MSBuild answers
  # according to global.json: absent on main, so .NET 10 and the net10.0 set;
  # pinned to 9.0.x on release/net9, so .NET 9 and the net9.0 set. One job
  # definition, correct on both branches, and nothing to keep in step by hand.
  #
  # Tags and manual runs only. It downloads a couple of hundred megabytes from
  # nuget.org, which is not something to do on every push, but a job that only
  # ever runs at tag time is a job that is broken at tag time, so
  # workflow_dispatch is there to exercise it deliberately.
  # =========================================================================
  offline-packages:
    name: Offline package set (windows-latest)
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest

    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            9.0.x
            10.0.x

      - name: Stage every package a restore needs
        shell: pwsh
        run: ./build/Get-OfflinePackages.ps1 -OutputDirectory offline-packages

      # The script throws if any single package fails to download, so this is
      # about the shape of the result rather than its success: a set small enough
      # to be missing the runtime packs would restore a build and then fail a
      # self-contained publish, which is the expensive place to find out.
      - name: Pack and checksum
        shell: pwsh
        run: |
          $packages = Get-ChildItem offline-packages -Filter *.nupkg
          $sizeMb = [math]::Round(($packages | Measure-Object -Property Length -Sum).Sum / 1MB, 1)
          Write-Host "$($packages.Count) packages, $sizeMb MB."

          if ($packages.Count -lt 60) { throw "Only $($packages.Count) packages staged. The set should be 68 or more." }
          if ($sizeMb -lt 150) { throw "Only $sizeMb MB staged. That is too small to include the runtime packs." }

          $name = "offline-packages-$env:GITHUB_REF_NAME"
          Compress-Archive -Path offline-packages/* -DestinationPath "$name.zip"

          # LF and two spaces, so GNU sha256sum -c accepts the file. Set-Content
          # would write CRLF, which it reports as "no properly formatted checksum
          # lines found" on exactly the machines most likely to check.
          $hash = (Get-FileHash "$name.zip" -Algorithm SHA256).Hash.ToLowerInvariant()
          [System.IO.File]::WriteAllText("$PWD/$name.zip.sha256", "$hash  $name.zip`n")
          Write-Host "SHA256 $hash  $name.zip"

      - name: Upload the offline package set
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: offline-packages
          path: |
            offline-packages-*.zip
            offline-packages-*.zip.sha256
          if-no-files-found: error
          retention-days: 90

  release:
    name: Attach package to the release
    needs: [package, offline-packages]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download deployment package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: deployment-package
          path: package

      # Kept in its own directory: the renaming step below globs the deployment
      # zip, and the offline set is already named after the tag.
      - name: Download the offline package set
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: offline-packages
          path: offline

      # Verifies the digest the Windows job computed, which proves the zip
      # survived the hop between runners and, incidentally, proves the checksum
      # file is in a format the operator's sha256sum will accept.
      - name: Verify checksums
        run: |
          set -euo pipefail
          (cd package && sha256sum -c ./*.sha256)
          (cd offline && sha256sum -c ./*.sha256)

      # Build.ps1 names the zip from the wall clock, which is right for a local
      # build and wrong for a release asset: --clobber only replaces an asset of
      # the same name, so re-running a tag would attach a second, differently
      # named zip and leave two candidate packages on one release. Renaming to
      # the tag makes the asset name stable and the replacement real.
      - name: Name the asset after the tag
        run: |
          set -euo pipefail
          cd package
          zip=$(ls SqlTicketsConnector-*.zip | head -1)
          mv "$zip" "SqlTicketsConnector-${GITHUB_REF_NAME}.zip"
          rm -f ./*.zip.sha256
          sha256sum "SqlTicketsConnector-${GITHUB_REF_NAME}.zip" > "SqlTicketsConnector-${GITHUB_REF_NAME}.zip.sha256"
          ls -la

      - name: Attach to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # gh release upload requires the release to exist; pushing a tag does
          # not create one. Create it as a draft so a person still decides what
          # ships, and so the run is not the thing that publishes.
          gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1 \
            || gh release create "${GITHUB_REF_NAME}" \
                 --repo "${GITHUB_REPOSITORY}" \
                 --verify-tag --draft --generate-notes \
                 --title "${GITHUB_REF_NAME}"
          gh release upload "${GITHUB_REF_NAME}" package/* offline/* --clobber --repo "${GITHUB_REPOSITORY}"
          echo "Attached the deployment package and the offline package set to ${GITHUB_REF_NAME}."
