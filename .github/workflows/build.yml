# ===========================================================================
# Build, test, and package.
#
# Runs on windows-latest, not ubuntu, for two reasons:
#   1. It is the deployment target. The event log sink, the certificate store
#      resolver and the win-x64 publish path only mean anything on Windows.
#   2. Grpc.Tools 2.40.0 ships a per-RID protoc. The Windows runner exercises the
#      same code generation an engineer gets locally, so a contract change that
#      breaks the generated stubs fails here rather than at install time.
#
# The build job's four gates are the same four Build.ps1 enforces before it will
# produce a deployment package: secret hygiene, a warning-free build, the tests,
# and the dependency audit. That parity is the point, and it is load-bearing now
# that the package job runs Build.ps1 to produce a release artefact: if you add a
# gate to one, add it to the other.
#
# Third-party actions are pinned to commit SHAs rather than tags. A tag can be
# moved; a SHA cannot. The version each SHA corresponds to is in the comment
# beside it, so a reviewer can check the claim.
# ===========================================================================

name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  # Publishing a release against a tag that already exists fires no push event.
  # Without this trigger such a release would never receive its package.
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  # Cancel superseded branch builds, never a tag or release build: those produce
  # an artefact somebody is waiting on, and a half-cancelled publish is worse
  # than a slow one.
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    name: Build and test (windows-latest)
    runs-on: windows-latest

    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up .NET 10
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore SqlTicketsConnector.sln

      # Fails the build when an appsettings.json gains a key matching
      # password|secret|pwd|apikey|connectionstring with a non-empty value.
      # Same task the projects run during a normal build; this runs it across the
      # whole repository without compiling anything.
      - name: Secret hygiene scan
        run: dotnet build build/SecretHygiene.proj -t:ScanAppSettingsForSecrets -nologo -v:m

      # The solution promises to build clean apart from NETSDK1206 and CS8981,
      # both suppressed in the project files with a comment saying why. Treating
      # everything else as an error is what keeps that promise true. It has
      # already earned its place: it caught an obsolete Azure.Identity
      # constructor, and NuGet downgrade conflicts across the three projects.
      - name: Build (warnings are errors)
        run: dotnet build SqlTicketsConnector.sln -c Release --no-restore -warnaserror

      - name: Test
        run: >
          dotnet test SqlTicketsConnector.sln
          -c Release --no-build --nologo
          --logger "trx;LogFileName=test-results.trx"
          --results-directory artifacts/test-results

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results
          path: artifacts/test-results
          retention-days: 30

      # dotnet list exits 0 whether or not it finds anything, so the output has
      # to be inspected. This is the check that would have caught the Kiota
      # header-leak advisory before it reached a release.
      - name: Dependency audit
        shell: pwsh
        run: |
          $vulnerable = dotnet list SqlTicketsConnector.sln package --vulnerable --include-transitive 2>&1 | Out-String
          Write-Host $vulnerable
          if ($vulnerable -match 'has the following vulnerable packages') {
              Write-Error 'Vulnerable packages found. Raise the version, or pin the transitive dependency with a comment naming the advisory.'
              exit 1
          }
          Write-Host 'No vulnerable packages.' -ForegroundColor Green

      # The OTLP exporter is optional and off by default, which is exactly how a
      # configuration rots: it shipped documented and unbuildable, because
      # Serilog.Sinks.OpenTelemetry needs Google.Protobuf 3.26.1 or later while
      # the contract codegen pins 3.18.0. Enabling it now raises the protobuf
      # runtime, and this step is what keeps that true. Last, because it
      # re-restores the solution with a different graph.
      - name: Build with the optional OTLP exporter
        run: |
          dotnet restore SqlTicketsConnector.sln -p:EnableOtlpExporter=true
          dotnet build SqlTicketsConnector.sln -c Release --no-restore -warnaserror -p:EnableOtlpExporter=true

  # =========================================================================
  # Produces the deployment package by running Build.ps1 exactly as an engineer
  # would, rather than reimplementing it here. The script re-runs the secret
  # scan, the warning-free build, the tests and the dependency audit before it
  # will publish, so the zip cannot come from a tree that would not pass review.
  #
  # A separate job, not extra steps on the build job: Build.ps1 clears the
  # artifacts directory, which is where the build job leaves its test results.
  # =========================================================================
  package:
    name: Deployment package (windows-latest)
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up .NET 10
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.0.x"

      # Self-contained: the .NET runtime is bundled, so the target server needs
      # nothing but Windows. Whoever downloads this zip should never have to go
      # and fetch something else to make it run.
      - name: Build the deployment package
        shell: pwsh
        run: ./Build.ps1 -Configuration Release -SelfContained

      # "Everything is in the zip" is a claim, so it gets checked rather than
      # assumed. The runtime files are what prove self-contained actually took.
      - name: Verify the package is complete and self-contained
        shell: pwsh
        run: |
          $zip = Get-ChildItem -Path . -Filter 'SqlTicketsConnector-*.zip' | Sort-Object LastWriteTime | Select-Object -Last 1
          $extract = Join-Path $env:RUNNER_TEMP 'package-check'
          Expand-Archive -Path $zip.FullName -DestinationPath $extract -Force

          $required = @(
              'publish/SqlTicketsConnector.exe',          # the service
              'publish/appsettings.json',                 # configuration template
              'publish/System.Private.CoreLib.dll',       # bundled runtime
              'publish/hostpolicy.dll',                   # bundled host
              'publish/grpc_csharp_ext.x64.dll',          # Grpc.Core native asset
              'SqlGraphPush/SqlGraphPush.exe',            # direct push tool
              'Install-Connector.ps1',
              'Manifest.json',
              'ConnectionInfo.json',
              'CustomConnectorPortMap.json',
              'README.md',
              'sql/01-least-privilege.sql',
              'sql/02-soft-delete.sql',
              'docs/SECURITY.md',
              'docs/RUNBOOK.md',
              'docs/ASSUMPTIONS.md'
          )

          $missing = @()
          foreach ($item in $required) {
              if (-not (Test-Path (Join-Path $extract $item))) { $missing += $item }
          }

          if ($missing) {
              $missing | ForEach-Object { Write-Error "Missing from the package: $_" }
              throw 'The deployment package is incomplete.'
          }

          # A framework-dependent build is roughly 20 MB; a self-contained one is
          # far larger. A size floor catches a silently reverted -SelfContained.
          $sizeMb = [math]::Round($zip.Length / 1MB, 1)
          if ($sizeMb -lt 60) {
              throw "Package is only $sizeMb MB. That is too small to contain the .NET runtime; was -SelfContained dropped?"
          }

          $count = (Get-ChildItem $extract -Recurse -File).Count
          Write-Host "Package OK: $($zip.Name), $sizeMb MB, $count files, runtime bundled." -ForegroundColor Green

      # README's "Transfer via SharePoint" section moves this zip through a
      # document library by hand. A checksum is what lets the operator on the
      # far end prove the file survived that round trip.
      #
      # The digest is written with LF and two spaces: GNU sha256sum -c treats a
      # trailing CR as part of the filename and reports "no properly formatted
      # checksum lines found", so Set-Content's CRLF would make the file useless
      # on exactly the machines most likely to check it.
      - name: Checksum
        shell: pwsh
        run: |
          $zip = Get-ChildItem -Path . -Filter 'SqlTicketsConnector-*.zip' | Sort-Object LastWriteTime | Select-Object -Last 1
          if (-not $zip) { Write-Error 'Build.ps1 produced no deployment zip.'; exit 1 }
          $hash = (Get-FileHash -Path $zip.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          [System.IO.File]::WriteAllText("$($zip.FullName).sha256", "$hash  $($zip.Name)`n")
          Write-Host "SHA256 $hash  $($zip.Name)"

      - name: Upload deployment package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: deployment-package
          path: |
            SqlTicketsConnector-*.zip
            SqlTicketsConnector-*.zip.sha256
          if-no-files-found: error
          retention-days: 90

  # =========================================================================
  # Attaches the package to the release for a v* tag. Split into its own job so
  # that contents: write, the only privilege in this workflow that can change
  # the repository, exists on a job that runs for tags and releases and nowhere
  # else.
  #
  # Both orderings work: pushing a v* tag creates a DRAFT release and populates
  # it, leaving a human to press publish; publishing a release that already
  # exists uploads into it. CI never publishes a release on its own, because the
  # zip is the artefact a change advisory board approves.
  # =========================================================================
  release:
    name: Attach package to the release
    needs: package
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download deployment package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: deployment-package
          path: package

      # Verifies the digest the Windows job computed, which proves the zip
      # survived the hop between runners and, incidentally, proves the checksum
      # file is in a format the operator's sha256sum will accept.
      - name: Verify checksum
        run: |
          set -euo pipefail
          cd package
          sha256sum -c ./*.sha256

      # Build.ps1 names the zip from the wall clock, which is right for a local
      # build and wrong for a release asset: --clobber only replaces an asset of
      # the same name, so re-running a tag would attach a second, differently
      # named zip and leave two candidate packages on one release. Renaming to
      # the tag makes the asset name stable and the replacement real.
      - name: Name the asset after the tag
        run: |
          set -euo pipefail
          cd package
          zip=$(ls SqlTicketsConnector-*.zip | head -1)
          mv "$zip" "SqlTicketsConnector-${GITHUB_REF_NAME}.zip"
          rm -f ./*.zip.sha256
          sha256sum "SqlTicketsConnector-${GITHUB_REF_NAME}.zip" > "SqlTicketsConnector-${GITHUB_REF_NAME}.zip.sha256"
          ls -la

      - name: Attach to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # gh release upload requires the release to exist; pushing a tag does
          # not create one. Create it as a draft so a person still decides what
          # ships, and so the run is not the thing that publishes.
          gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1 \
            || gh release create "${GITHUB_REF_NAME}" \
                 --repo "${GITHUB_REPOSITORY}" \
                 --verify-tag --draft --generate-notes \
                 --title "${GITHUB_REF_NAME}"
          gh release upload "${GITHUB_REF_NAME}" package/* --clobber --repo "${GITHUB_REPOSITORY}"
          echo "Attached the deployment package to ${GITHUB_REF_NAME}."
