<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1900 1180" width="1900" height="1180" font-family="Segoe UI, Calibri, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6a76"/></marker>
    <marker id="at" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1f7ac0"/></marker>
  </defs>
  <rect width="1900" height="1180" fill="#ffffff"/>
  <text x="50" y="62" font-size="34" font-weight="600" fill="#0b2f52">Microsoft 365 Copilot connector platform</text>
  <text x="50" y="98" font-size="20" fill="#5b6a76">High level architecture as of v1.7.1. Dashed elements are optional, out of scope, or the path not taken.</text>
  <rect x="50" y="150" width="380" height="520" rx="14" fill="#f3f7fa" stroke="#d6e0e9" stroke-width="2"/>
  <text x="72" y="184" font-size="17" font-weight="600" letter-spacing="1.5" fill="#0b2f52">SOURCES</text>
  <text x="72" y="208" font-size="15" fill="#5b6a76">On premises, never exposed to the cloud</text>
  <rect x="520" y="150" width="520" height="520" rx="14" fill="#f3f7fa" stroke="#d6e0e9" stroke-width="2"/>
  <text x="542" y="184" font-size="17" font-weight="600" letter-spacing="1.5" fill="#0b2f52">THE PUSH TOOLS</text>
  <text x="542" y="208" font-size="15" fill="#5b6a76">Console apps. One line of Main each</text>
  <rect x="1130" y="150" width="430" height="520" rx="14" fill="#f3f7fa" stroke="#d6e0e9" stroke-width="2"/>
  <text x="1152" y="184" font-size="17" font-weight="600" letter-spacing="1.5" fill="#0b2f52">MICROSOFT 365 CLOUD</text>
  <rect x="520" y="720" width="520" height="390" rx="14" fill="#f3f7fa" stroke="#d6e0e9" stroke-width="2"/>
  <text x="542" y="754" font-size="17" font-weight="600" letter-spacing="1.5" fill="#0b2f52">OPERATIONS</text>
  <rect x="1130" y="720" width="430" height="390" rx="14" fill="#f3f7fa" stroke="#d6e0e9" stroke-width="2"/>
  <text x="1152" y="754" font-size="17" font-weight="600" letter-spacing="1.5" fill="#0b2f52">THE OTHER PATH</text>
  <text x="1152" y="778" font-size="15" fill="#5b6a76">Agent hosted, no Graph dependency</text>
  <polyline points="400,263 550,271" fill="none" stroke="#5b6a76" stroke-width="2" stroke-linejoin="round" marker-end="url(#a)"/>
  <polyline points="400,363 550,271" fill="none" stroke="#5b6a76" stroke-width="2" stroke-linejoin="round" marker-end="url(#a)"/>
  <polyline points="400,473 475,473 475,271 550,271" fill="none" stroke="#5b6a76" stroke-width="2" stroke-dasharray="7,6" stroke-linejoin="round" marker-end="url(#a)"/>
  <polyline points="400,593 475,593 475,271 550,271" fill="none" stroke="#5b6a76" stroke-width="2" stroke-dasharray="7,6" stroke-linejoin="round" marker-end="url(#a)"/>
  <polyline points="1010,271 1160,271" fill="none" stroke="#1f7ac0" stroke-width="3.5" stroke-linejoin="round" marker-end="url(#at)"/>
  <polyline points="1345,317 1345,337" fill="none" stroke="#5b6a76" stroke-width="2" stroke-linejoin="round" marker-end="url(#a)"/>
  <polyline points="1345,413 1345,433" fill="none" stroke="#5b6a76" stroke-width="2" stroke-linejoin="round" marker-end="url(#a)"/>
  <polyline points="1010,271 1068,271 1068,488 1010,488" fill="none" stroke="#5b6a76" stroke-width="2" stroke-linejoin="round" marker-end="url(#a)"/>
  <polyline points="780,413 780,433" fill="none" stroke="#5b6a76" stroke-width="2" stroke-dasharray="7,6" stroke-linejoin="round" marker-end="url(#a)"/>
  <polyline points="1010,488 1036,488 1036,835 1010,835" fill="none" stroke="#5b6a76" stroke-width="2" stroke-linejoin="round" marker-end="url(#a)"/>
  <polyline points="780,880 780,900" fill="none" stroke="#5b6a76" stroke-width="2" stroke-linejoin="round" marker-end="url(#a)"/>
  <polyline points="780,990 780,1010" fill="none" stroke="#5b6a76" stroke-width="2" stroke-linejoin="round" marker-end="url(#a)"/>
  <polyline points="1010,271 1052,271 1052,1048 1010,1048" fill="none" stroke="#5b6a76" stroke-width="2" stroke-dasharray="7,6" stroke-linejoin="round" marker-end="url(#a)"/>
  <polyline points="1345,910 1345,890" fill="none" stroke="#1f7ac0" stroke-width="3.5" stroke-linejoin="round" marker-end="url(#at)"/>
  <rect x="80" y="225" width="320" height="76" rx="10" fill="#5c8ca8" stroke="#5c8ca8" stroke-width="2" opacity="1"/>
  <text x="98" y="257" font-size="19" font-weight="600" fill="#ffffff">SQL Server, tickets</text>
  <text x="98" y="281" font-size="15" fill="#dbe7f0">SELECT only, least privilege</text>
  <rect x="80" y="325" width="320" height="76" rx="10" fill="#5c8ca8" stroke="#5c8ca8" stroke-width="2" opacity="1"/>
  <text x="98" y="357" font-size="19" font-weight="600" fill="#ffffff">SQL Server, hierarchy</text>
  <text x="98" y="381" font-size="15" fill="#dbe7f0">Customers, engagements, time</text>
  <rect x="80" y="425" width="320" height="96" rx="10" fill="#5c8ca8" stroke="#5c8ca8" stroke-width="2" stroke-dasharray="8,6" opacity="0.58"/>
  <text x="98" y="457" font-size="19" font-weight="600" fill="#ffffff">Cloudera CDP</text>
  <text x="98" y="481" font-size="15" fill="#dbe7f0">HDFS, Hive, Atlas catalogue</text>
  <rect x="80" y="545" width="320" height="96" rx="10" fill="#5c8ca8" stroke="#5c8ca8" stroke-width="2" stroke-dasharray="8,6" opacity="0.58"/>
  <text x="98" y="577" font-size="19" font-weight="600" fill="#ffffff">Apache Ranger</text>
  <text x="98" y="601" font-size="15" fill="#dbe7f0">Read before anything else.</text>
  <text x="98" y="621" font-size="15" fill="#dbe7f0">A masked table is never indexed</text>
  <rect x="550" y="225" width="460" height="92" rx="10" fill="#1f7ac0" stroke="#1f7ac0" stroke-width="2" opacity="1"/>
  <text x="568" y="257" font-size="19" font-weight="600" fill="#ffffff">PushCore engine</text>
  <text x="568" y="281" font-size="15" fill="#dbe7f0">Read, map, truncate, ACL, hash, batch, write</text>
  <rect x="550" y="337" width="460" height="76" rx="10" fill="#1f7ac0" stroke="#1f7ac0" stroke-width="2" stroke-dasharray="8,6" opacity="0.58"/>
  <text x="568" y="369" font-size="19" font-weight="600" fill="#ffffff">Second instance, refused</text>
  <text x="568" y="393" font-size="15" fill="#dbe7f0">One live crawl per connection, by lease</text>
  <rect x="550" y="433" width="460" height="110" rx="10" fill="#0b2f52" stroke="#0b2f52" stroke-width="2" opacity="1"/>
  <text x="568" y="465" font-size="19" font-weight="600" fill="#ffffff">Crawl state database</text>
  <text x="568" y="489" font-size="15" fill="#dbe7f0">What was seen, what changed, what to delete,</text>
  <text x="568" y="509" font-size="15" fill="#dbe7f0">the run lock, and the principal cache</text>
  <rect x="550" y="563" width="460" height="76" rx="10" fill="#1f7ac0" stroke="#1f7ac0" stroke-width="2" opacity="1"/>
  <text x="568" y="595" font-size="19" font-weight="600" fill="#ffffff">Release package</text>
  <text x="568" y="619" font-size="15" fill="#dbe7f0">Authenticode, file catalog, SBOM</text>
  <rect x="1160" y="225" width="370" height="92" rx="10" fill="#0b2f52" stroke="#0b2f52" stroke-width="2" opacity="1"/>
  <text x="1178" y="257" font-size="19" font-weight="600" fill="#ffffff">Copilot connectors API</text>
  <text x="1178" y="281" font-size="15" fill="#dbe7f0">Connections, schema, items, $batch</text>
  <rect x="1160" y="337" width="370" height="76" rx="10" fill="#0b2f52" stroke="#0b2f52" stroke-width="2" opacity="1"/>
  <text x="1178" y="369" font-size="19" font-weight="600" fill="#ffffff">Microsoft Search</text>
  <text x="1178" y="393" font-size="15" fill="#dbe7f0">Result types and display templates</text>
  <rect x="1160" y="433" width="370" height="76" rx="10" fill="#0b2f52" stroke="#0b2f52" stroke-width="2" opacity="1"/>
  <text x="1178" y="465" font-size="19" font-weight="600" fill="#ffffff">Microsoft 365 Copilot</text>
  <text x="1178" y="489" font-size="15" fill="#dbe7f0">Grounded on connector content</text>
  <rect x="1160" y="529" width="370" height="97" rx="10" fill="#0b2f52" stroke="#0b2f52" stroke-width="2" opacity="1"/>
  <text x="1178" y="561" font-size="19" font-weight="600" fill="#ffffff">Microsoft Entra ID</text>
  <text x="1178" y="585" font-size="15" fill="#dbe7f0">Groups the access control lists</text>
  <text x="1178" y="605" font-size="15" fill="#dbe7f0">are expressed in. No user ACEs</text>
  <rect x="550" y="790" width="460" height="90" rx="10" fill="#1f7ac0" stroke="#1f7ac0" stroke-width="2" opacity="1"/>
  <text x="568" y="822" font-size="19" font-weight="600" fill="#ffffff">Operations dashboard</text>
  <text x="568" y="846" font-size="15" fill="#dbe7f0">Runs, items, health. Read only, by role</text>
  <rect x="550" y="900" width="460" height="90" rx="10" fill="#1f7ac0" stroke="#1f7ac0" stroke-width="2" opacity="1"/>
  <text x="568" y="932" font-size="19" font-weight="600" fill="#ffffff">Health watchdog</text>
  <text x="568" y="956" font-size="15" fill="#dbe7f0">Freshness, and the paging matrix behind it</text>
  <rect x="550" y="1010" width="460" height="76" rx="10" fill="#1f7ac0" stroke="#1f7ac0" stroke-width="2" stroke-dasharray="8,6" opacity="0.58"/>
  <text x="568" y="1042" font-size="19" font-weight="600" fill="#ffffff">OTLP collector</text>
  <text x="568" y="1066" font-size="15" fill="#dbe7f0">Spans and metrics per run. Optional</text>
  <rect x="1160" y="790" width="370" height="100" rx="10" fill="#0b2f52" stroke="#0b2f52" stroke-width="2" opacity="1"/>
  <text x="1178" y="822" font-size="19" font-weight="600" fill="#ffffff">Graph connector agent</text>
  <text x="1178" y="846" font-size="15" fill="#dbe7f0">Holds the tenant relationship.</text>
  <text x="1178" y="866" font-size="15" fill="#dbe7f0">Polls the connector over gRPC</text>
  <rect x="1160" y="910" width="370" height="100" rx="10" fill="#1f7ac0" stroke="#1f7ac0" stroke-width="2" stroke-dasharray="8,6" opacity="0.58"/>
  <text x="1178" y="942" font-size="19" font-weight="600" fill="#ffffff">SqlTicketsConnector</text>
  <text x="1178" y="966" font-size="15" fill="#dbe7f0">Loopback gRPC service.</text>
  <text x="1178" y="986" font-size="15" fill="#dbe7f0">Never calls Microsoft Graph</text>
  <rect x="444.8" y="255" width="60.4" height="23" rx="5" fill="#ffffff" opacity="0.95"/>
  <text x="475" y="271" font-size="14" fill="#5b6a76" text-anchor="middle">SELECT</text>
  <rect x="452.2" y="327.7" width="45.6" height="23" rx="5" fill="#ffffff" opacity="0.95"/>
  <text x="475" y="343.7" font-size="14" fill="#5b6a76" text-anchor="middle">read</text>
  <rect x="971.6" y="259" width="178.8" height="23" rx="5" fill="#ffffff" opacity="0.95"/>
  <text x="1061" y="275" font-size="14" fill="#5b6a76" text-anchor="middle">$batch, 20 per request</text>
  <rect x="963.8" y="332.8" width="208.4" height="23" rx="5" fill="#ffffff" opacity="0.95"/>
  <text x="1068" y="348.8" font-size="14" fill="#5b6a76" text-anchor="middle">change detection, run lock</text>
  <rect x="694.3" y="414.2" width="171.4" height="23" rx="5" fill="#ffffff" opacity="0.95"/>
  <text x="780" y="430.2" font-size="14" fill="#5b6a76" text-anchor="middle">lease refused, exit 5</text>
  <rect x="961.4" y="649.5" width="149.2" height="23" rx="5" fill="#ffffff" opacity="0.95"/>
  <text x="1036" y="665.5" font-size="14" fill="#5b6a76" text-anchor="middle">read only, by role</text>
  <rect x="716.5" y="874.8" width="127" height="23" rx="5" fill="#ffffff" opacity="0.95"/>
  <text x="780" y="890.8" font-size="14" fill="#5b6a76" text-anchor="middle">health endpoint</text>
  <rect x="749.8" y="991.2" width="60.4" height="23" rx="5" fill="#ffffff" opacity="0.95"/>
  <text x="780" y="1007.2" font-size="14" fill="#5b6a76" text-anchor="middle">alerts</text>
  <rect x="1277.8" y="891.2" width="134.4" height="23" rx="5" fill="#ffffff" opacity="0.95"/>
  <text x="1345" y="907.2" font-size="14" fill="#5b6a76" text-anchor="middle">gRPC on loopback</text>
  <text x="50" y="1154" font-size="15" fill="#5b6a76">Every item written to Microsoft Graph carries an access control list derived from its source, so Copilot returns to each user only what the source system would.</text>
</svg>
