<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1554 1000" width="1554" height="1000" role="img" aria-label="Decision tree for routing a Copilot question. Gate one: do the askers hold M365 licences — if not, Azure AI Foundry. Gate two: who owns the data. Owned data passes a content-and-group-access gate and then a freshness-and-deletion-SLA gate before being indexed by a synced Copilot connector. Data that is row-level secured or computed, and that models cleanly, goes to a Power BI semantic model, whose storage mode — Direct Lake, Import or DirectQuery — is picked by OneLake residency and by whether a second copy is permitted. Vendor-licensed data goes to a live tool call unless a signed AI rider permits indexing. The live-call branch offers four leaves: a federated Copilot connector, which is an MCP server Microsoft fronts and the only no-copy path that reaches Microsoft 365 Copilot chat; an API action; an MCP server you build; and a ready-made MCP server somebody else publishes. Azure AI Foundry is the escape hatch, forced by askers outside the tenant, network isolation, a model that must be pinned and validated, or retrieval you control.">
  <title>Routing a Copilot question by ownership, then by residency, then by cost</title>
  <desc>Four gates decide between indexing content in a synced Copilot connector, modelling it in Power BI, and fetching it live with a tool call. Ownership routes first; freshness and deletion SLA decide the owned branch; OneLake residency picks the semantic model's storage mode; licensed vendor data goes live by default, and a federated Copilot connector is the live path that still reaches Microsoft 365 Copilot chat.</desc>

  <style>
    :root, svg {
      --ground:  #FBFCFC;
      --surface: #FBFCFC;
      --alt:     #E9EEEC;
      --ink:     #111819;
      --muted:   #55656A;
      --rule:    #B6C2BF;
      --accent:  #12514E;
      --asoft:   #E0EAE8;
      --risk:    #A0392F;
    }
    @media (prefers-color-scheme: dark) {
      :root, svg {
        --ground:  #0C1214;
        --surface: #141C1E;
        --alt:     #1B2427;
        --ink:     #E4EBEA;
        --muted:   #94A3A6;
        --rule:    #354245;
        --accent:  #58C4AF;
        --asoft:   #16302E;
        --risk:    #E38175;
      }
    }
    .bg      { fill: var(--ground); }
    .n-box   { fill: var(--surface); stroke: var(--rule); stroke-width: 1.25; }
    .n-gate  { fill: var(--alt); stroke: var(--muted); stroke-width: 1.25; }
    .n-start { fill: var(--asoft); stroke: var(--accent); stroke-width: 1.5; }
    .n-index { fill: var(--asoft); stroke: var(--accent); stroke-width: 1.75; }
    .n-call  { fill: var(--alt);   stroke: var(--ink);   stroke-width: 1.75; }
    .n-model { fill: var(--asoft); stroke: var(--accent); stroke-width: 1.75; stroke-dasharray: 6 3; }
    .n-esc   { fill: var(--alt);   stroke: var(--rule);  stroke-width: 1.25; stroke-dasharray: 3 3; }

    text { font-family: "IBM Plex Sans", "Segoe UI", Helvetica, Arial, sans-serif; }
    .t-title { fill: var(--ink);   font-size: 13px; font-weight: 600; }
    .t-body  { fill: var(--ink);   font-size: 12.5px; }
    .t-cost  { fill: var(--muted); font-size: 10.5px; font-family: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace; }
    .t-edge  { fill: var(--muted); font-size: 10.5px; font-family: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace; }
    .t-accent{ fill: var(--accent); font-size: 13.5px; font-weight: 600; letter-spacing: .05em; }
    .t-risk  { fill: var(--risk);  font-size: 10.5px; font-family: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace; }
    .t-leaf  { fill: var(--muted); font-size: 9.5px; font-family: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace; }
    .t-leafr { fill: var(--risk);  font-size: 9.5px; font-family: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace; }

    .edge      { stroke: var(--muted); stroke-width: 1.4; fill: none; }
    .edge-risk { stroke: var(--risk);  stroke-width: 1.4; fill: none; stroke-dasharray: 5 4; }
    .tick      { stroke: var(--rule);  stroke-width: 1.25; fill: none; }
    .head      { fill: var(--muted); }
    .head-risk { fill: var(--risk); }
  </style>

  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" class="head"/>
    </marker>
    <marker id="ar-risk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" class="head-risk"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1554" height="1000"/>

  <!-- START -->
  <rect class="n-start" x="560" y="18" width="200" height="44" rx="3"/>
  <text class="t-title" x="660" y="45" text-anchor="middle">A question for Copilot</text>
  <path class="edge" d="M660,62 L660,94" marker-end="url(#ar)"/>

  <!-- GATE 1 -->
  <rect class="n-gate" x="528" y="96" width="264" height="48" rx="3"/>
  <text class="t-body" x="660" y="125" text-anchor="middle">Do the askers hold M365 licences?</text>

  <path class="edge" d="M792,120 L934,120" marker-end="url(#ar)"/>
  <text class="t-edge" x="863" y="111" text-anchor="middle">no</text>
  <rect class="n-esc" x="936" y="80" width="558" height="96" rx="3"/>
  <text class="t-title" x="1215" y="104" text-anchor="middle">Azure AI Foundry</text>
  <text class="t-cost" x="1215" y="122" text-anchor="middle">months to build &#183; tokens + hosting + headcount</text>
  <text class="t-cost" x="1215" y="145" text-anchor="middle">also forced by: network isolation &#183; a model you must pin and</text>
  <text class="t-cost" x="1215" y="159" text-anchor="middle">validate &#183; retrieval you control</text>

  <path class="edge" d="M660,144 L660,178" marker-end="url(#ar)"/>
  <text class="t-edge" x="672" y="167">yes</text>

  <!-- GATE 2 -->
  <rect class="n-gate" x="528" y="180" width="264" height="48" rx="3"/>
  <text class="t-body" x="660" y="209" text-anchor="middle">Who owns the data?</text>

  <path class="edge" d="M660,228 L660,256 L265,256 L265,288" marker-end="url(#ar)"/>
  <path class="edge" d="M660,256 L1215,256 L1215,288" marker-end="url(#ar)"/>
  <text class="t-edge" x="452" y="248" text-anchor="middle">we own it</text>
  <text class="t-edge" x="940" y="248" text-anchor="middle">licensed from a vendor</text>

  <!-- GATE 3 : owned -->
  <rect class="n-gate" x="110" y="290" width="310" height="74" rx="3"/>
  <text class="t-body" x="265" y="317" text-anchor="middle">Is it content &#8212; and is access</text>
  <text class="t-body" x="265" y="336" text-anchor="middle">expressible as Entra groups?</text>
  <text class="t-cost" x="265" y="353" text-anchor="middle">no RLS, no MNPI, no dynamic barriers</text>

  <!-- GATE 4 : licensed -->
  <rect class="n-gate" x="1050" y="290" width="330" height="74" rx="3"/>
  <text class="t-body" x="1215" y="317" text-anchor="middle">Does the licence permit indexing</text>
  <text class="t-body" x="1215" y="336" text-anchor="middle">and AI grounding?</text>
  <text class="t-cost" x="1215" y="353" text-anchor="middle">redistribution + derived data + AI rider</text>

  <!-- GATE 3 outputs -->
  <path class="edge" d="M180,364 L180,398" marker-end="url(#ar)"/>
  <text class="t-edge" x="190" y="386">both yes</text>
  <path class="edge" d="M390,364 L390,505"/>
  <text class="t-edge" x="400" y="392">either one is no</text>

  <!-- GATE 3b : the SLA gate -->
  <rect class="n-gate" x="60" y="400" width="280" height="76" rx="3"/>
  <text class="t-body" x="200" y="427" text-anchor="middle">Can you live with crawl-interval</text>
  <text class="t-body" x="200" y="446" text-anchor="middle">freshness and crawl-bound deletion?</text>
  <text class="t-cost" x="200" y="464" text-anchor="middle">a direct push never deletes at all</text>

  <path class="edge" d="M140,476 L140,598" marker-end="url(#ar)"/>
  <text class="t-edge" x="150" y="530">yes</text>
  <path class="edge" d="M300,476 L300,505"/>
  <text class="t-edge" x="310" y="496">no</text>

  <!-- shared trunk to CALL, with a branch into MODEL -->
  <path class="edge" d="M300,505 L1080,505 L1080,598" marker-end="url(#ar)"/>
  <path class="edge" d="M390,505 L390,532 L696,532 L696,598" marker-end="url(#ar)"/>
  <text class="t-edge" x="543" y="525" text-anchor="middle">row-level or computed, and it models cleanly</text>

  <!-- GATE 4 outputs -->
  <path class="edge" d="M1330,364 L1330,598" marker-end="url(#ar)"/>
  <text class="t-edge" x="1340" y="430">no &#8212; the usual answer</text>

  <path class="edge-risk" d="M1100,364 L1100,578 L250,578 L250,598" marker-end="url(#ar-risk)"/>
  <text class="t-risk" x="675" y="570" text-anchor="middle">yes, with a signed AI rider &#8212; rare, and audited</text>

  <!-- OUTCOME BANDS -->
  <rect class="n-index" x="60" y="600" width="388" height="52" rx="3"/>
  <text class="t-accent" x="254" y="624" text-anchor="middle">INDEX IT</text>
  <text class="t-cost" x="254" y="641" text-anchor="middle">synced connector &#183; a copy in the Graph index, M365-wide</text>

  <rect class="n-model" x="478" y="600" width="436" height="52" rx="3"/>
  <text class="t-title" x="696" y="624" text-anchor="middle">MODEL IT</text>
  <text class="t-cost" x="696" y="641" text-anchor="middle">Fabric plane &#183; computed per user &#183; RLS at query time</text>

  <rect class="n-call" x="944" y="600" width="550" height="52" rx="3"/>
  <text class="t-title" x="1219" y="624" text-anchor="middle">CALL IT</text>
  <text class="t-cost" x="1219" y="641" text-anchor="middle">live tool call &#183; nothing stored, entitled at the source per user</text>

  <!-- ticks -->
  <path class="tick" d="M122,652 L122,676"/>
  <path class="tick" d="M254,652 L254,676"/>
  <path class="tick" d="M386,652 L386,676"/>
  <path class="tick" d="M548,652 L548,676"/>
  <path class="tick" d="M696,652 L696,676"/>
  <path class="tick" d="M844,652 L844,676"/>
  <path class="tick" d="M1010,652 L1010,676"/>
  <path class="tick" d="M1149,652 L1149,676"/>
  <path class="tick" d="M1288,652 L1288,676"/>
  <path class="tick" d="M1427,652 L1427,676"/>

  <!-- INDEX leaves -->
  <rect class="n-box" x="60" y="678" width="124" height="104" rx="3"/>
  <text class="t-title" x="122" y="700" text-anchor="middle">Gallery: synced</text>
  <text class="t-leaf" x="122" y="719" text-anchor="middle">build: hours&#8211;days</text>
  <text class="t-leaf" x="122" y="734" text-anchor="middle">run: item quota</text>
  <text class="t-leaf" x="122" y="749" text-anchor="middle">org-level auth</text>
  <text class="t-leaf" x="122" y="764" text-anchor="middle">check the list</text>

  <rect class="n-box" x="192" y="678" width="124" height="104" rx="3"/>
  <text class="t-title" x="254" y="700" text-anchor="middle">Custom: agent</text>
  <text class="t-leaf" x="254" y="719" text-anchor="middle">build: weeks</text>
  <text class="t-leaf" x="254" y="734" text-anchor="middle">needs a host</text>
  <text class="t-leaf" x="254" y="749" text-anchor="middle">deletes on recrawl</text>
  <text class="t-leaf" x="254" y="764" text-anchor="middle">org-level ACLs</text>

  <rect class="n-box" x="324" y="678" width="124" height="104" rx="3"/>
  <text class="t-title" x="386" y="700" text-anchor="middle">Custom: push</text>
  <text class="t-leaf" x="386" y="719" text-anchor="middle">build: weeks</text>
  <text class="t-leaf" x="386" y="734" text-anchor="middle">runs anywhere</text>
  <text class="t-leafr" x="386" y="749" text-anchor="middle">never deletes</text>
  <text class="t-leaf" x="386" y="764" text-anchor="middle">org-level ACLs</text>

  <!-- MODEL leaves -->
  <rect class="n-box" x="478" y="678" width="140" height="104" rx="3"/>
  <text class="t-title" x="548" y="700" text-anchor="middle">Direct Lake</text>
  <text class="t-leaf" x="548" y="719" text-anchor="middle">needs it in OneLake</text>
  <text class="t-leaf" x="548" y="734" text-anchor="middle">no copy, no refresh</text>
  <text class="t-leaf" x="548" y="749" text-anchor="middle">needs F2+ capacity</text>
  <text class="t-leaf" x="548" y="764" text-anchor="middle">import-class speed</text>

  <rect class="n-box" x="626" y="678" width="140" height="104" rx="3"/>
  <text class="t-title" x="696" y="700" text-anchor="middle">Import</text>
  <text class="t-leafr" x="696" y="719" text-anchor="middle">a governed copy</text>
  <text class="t-leaf" x="696" y="734" text-anchor="middle">VertiPaq, in-region</text>
  <text class="t-leaf" x="696" y="749" text-anchor="middle">refresh-bound</text>
  <text class="t-leaf" x="696" y="764" text-anchor="middle">fastest queries</text>

  <rect class="n-box" x="774" y="678" width="140" height="104" rx="3"/>
  <text class="t-title" x="844" y="700" text-anchor="middle">DirectQuery</text>
  <text class="t-leaf" x="844" y="719" text-anchor="middle">no rows stored</text>
  <text class="t-leaf" x="844" y="734" text-anchor="middle">live at the source</text>
  <text class="t-leafr" x="844" y="749" text-anchor="middle">load &#8733; concurrency</text>
  <text class="t-leaf" x="844" y="764" text-anchor="middle">the no-copy answer</text>

  <!-- CALL leaves -->
  <rect class="n-index" x="944" y="678" width="133" height="104" rx="3"/>
  <text class="t-title" x="1010" y="700" text-anchor="middle">Federated</text>
  <text class="t-leaf" x="1010" y="719" text-anchor="middle">build: config</text>
  <text class="t-leaf" x="1010" y="734" text-anchor="middle">reaches M365 chat</text>
  <text class="t-leaf" x="1010" y="749" text-anchor="middle">per-user OAuth</text>
  <text class="t-leafr" x="1010" y="764" text-anchor="middle">read-only</text>

  <rect class="n-box" x="1083" y="678" width="133" height="104" rx="3"/>
  <text class="t-title" x="1149" y="700" text-anchor="middle">API action</text>
  <text class="t-leaf" x="1149" y="719" text-anchor="middle">build: days&#8211;2wk</text>
  <text class="t-leaf" x="1149" y="734" text-anchor="middle">run: per call</text>
  <text class="t-leaf" x="1149" y="749" text-anchor="middle">an agent hosts it</text>
  <text class="t-leaf" x="1149" y="764" text-anchor="middle">watch fan-out</text>

  <rect class="n-box" x="1222" y="678" width="133" height="104" rx="3"/>
  <text class="t-title" x="1288" y="700" text-anchor="middle">MCP server</text>
  <text class="t-leaf" x="1288" y="719" text-anchor="middle">build: days&#8211;2wk</text>
  <text class="t-leaf" x="1288" y="734" text-anchor="middle">run: many clients</text>
  <text class="t-leaf" x="1288" y="749" text-anchor="middle">you own auth</text>
  <text class="t-leaf" x="1288" y="764" text-anchor="middle">wired per client</text>

  <rect class="n-esc" x="1361" y="678" width="133" height="104" rx="3"/>
  <text class="t-title" x="1427" y="700" text-anchor="middle">Ready-made MCP</text>
  <text class="t-leaf" x="1427" y="719" text-anchor="middle">build: hours&#8211;days</text>
  <text class="t-leaf" x="1427" y="734" text-anchor="middle">run: per call</text>
  <text class="t-leafr" x="1427" y="749" text-anchor="middle">their code, your data</text>
  <text class="t-leaf" x="1427" y="764" text-anchor="middle">check identity flow</text>

  <!-- how the model gets asked -->
  <path class="tick" d="M696,782 L696,806"/>
  <rect class="n-gate" x="478" y="808" width="436" height="76" rx="3"/>
  <text class="t-title" x="696" y="830" text-anchor="middle">Asked in words by</text>
  <text class="t-cost" x="696" y="849" text-anchor="middle">Power BI Copilot &amp; Q&amp;A &#183; Fabric data agent &#183; both need F2+</text>
  <text class="t-cost" x="696" y="863" text-anchor="middle">F64 is the separate threshold that drops viewer Pro licences</text>
  <text class="t-risk" x="696" y="877" text-anchor="middle">neither reaches M365 chat alone &#8212; Copilot Studio is the hop</text>

  <text class="t-cost" x="777" y="916" text-anchor="middle">Build effort assumes the source system and its API already exist. If they do not, that is the real project.</text>
  <text class="t-cost" x="777" y="934" text-anchor="middle">Only the agent-hosted connector deletes. Only DirectQuery and the CALL leaves store nothing. Only the federated connector does both &#8212; no copy, and M365 chat reach.</text>
  <text class="t-cost" x="777" y="952" text-anchor="middle">Storage mode is not a preference: OneLake residency and your no-copy rule pick it, and a shortcut registers data in OneLake without moving it.</text>
  <text class="t-risk" x="777" y="970" text-anchor="middle">A federated connector is read-only and reaches Copilot Chat, Excel, Researcher and Cowork &#8212; not every surface, and never a write. Each user authenticates as themselves.</text>
</svg>
