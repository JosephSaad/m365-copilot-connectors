# ===========================================================================
# .pre-commit-config.yaml
#
# Install once per clone:
#     pip install pre-commit
#     pre-commit install
#
# Then every commit is scanned before it exists. Run over the whole history at
# any time with:
#     pre-commit run --all-files
#     gitleaks detect --config .gitleaks.toml --redact
# ===========================================================================

repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks
        name: gitleaks (staged changes)
        args: ["protect", "--staged", "--redact", "--config", ".gitleaks.toml"]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: detect-private-key
      - id: check-added-large-files
        args: ["--maxkb=2048"]
      - id: end-of-file-fixer
      - id: trailing-whitespace

  - repo: local
    hooks:
      # Certificate material never belongs in the repository. The connector loads
      # certificates from the Windows certificate store and nowhere else.
      - id: no-certificate-files
        name: reject committed certificate or key files
        entry: >-
          bash -c 'files=$(git diff --cached --name-only --diff-filter=A |
          grep -Ei "\.(pfx|p12|pem|key|cer|crt)$" || true);
          if [ -n "$files" ]; then
            echo "Refusing to commit certificate or key material:"; echo "$files";
            echo "Install certificates into the Windows certificate store instead. See docs/SECURITY.md.";
            exit 1;
          fi'
        language: system
        pass_filenames: false

      # The same rule the build enforces, run before the commit rather than after.
      - id: appsettings-secret-scan
        name: appsettings secret hygiene
        entry: dotnet build build/SecretHygiene.proj -t:ScanAppSettingsForSecrets -nologo -v:m
        language: system
        pass_filenames: false
        files: 'appsettings.*\.json$'
